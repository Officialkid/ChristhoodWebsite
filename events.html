    <style>
        :root {
            --Royal-purple: #4b248c;
            --Deep-purple: #2d0f5a;
            --Light-purple: #7b5bbe;
            --Gold-color: #F3CC3C;
            --Light-gold: #f8de84;
            --Primary-Blue: #0047AB;
            --Dark-gray: #333333;
            --Light-gray: #F5F5F5;
            --White: #FFFFFF;
            --Error-red: #E74C3C;
            --Success-green: #2ECC71;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            line-height: 1.6;
            color: var(--Dark-gray);
            background: linear-gradient(135deg, var(--Deep-purple), var(--Primary-Blue));
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 0 3rem;
        }

        @media (max-width: 992px) {
            .container {
                padding-top: 1.5rem;
            }
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
            color: var(--White);
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, var(--Gold-color), var(--Light-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .events-grid.single {
            grid-template-columns: minmax(320px, 520px);
            justify-content: center;
        }

        .events-grid.loading {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .event-card.skeleton {
            position: relative;
            overflow: hidden;
            background: #f0e8ff;
            border: 2px solid transparent;
        }

        .skeleton-block {
            background: #f0e8ff;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        .skeleton-shimmer::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150px;
            height: 100%;
            width: 150px;
            background: linear-gradient(90deg, transparent, #d4b8ff, transparent);
            animation: shimmer 1.2s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(450px);
            }
        }

        .event-card {
            background: var(--White);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
            border: 2px solid transparent;
            background: linear-gradient(135deg, var(--White), #f8f9fa);
        }

        .events-message {
            text-align: center;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 2rem 1.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .event-card.ended {
            border-bottom: 2px solid #b0b0b0;
        }

        .event-card:hover {
            transform: translateY(-5px);
            border-color: var(--Gold-color);
        }

        .event-card.ended:hover {
            transform: none;
            border-color: transparent;
        }

        .event-poster {
            width: 100%;
            height: 220px;
            background: linear-gradient(45deg, var(--Royal-purple), var(--Light-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .event-poster.has-image {
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
        }

        .event-card.ended .event-poster {
            filter: grayscale(75%);
            opacity: 0.85;
        }

        .event-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(45deg, var(--Gold-color), var(--Light-gold));
            color: var(--Dark-gray);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .event-card.ended .event-tag {
            background: #888888;
            color: var(--White);
        }

        .event-content {
            padding: 1.5rem;
        }

        .event-title {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, var(--Royal-purple), var(--Light-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .event-subtitle {
            color: var(--Dark-gray);
            opacity: 0.8;
            margin-bottom: 1rem;
        }

        .event-detail {
            display: flex;
            margin-bottom: 0.5rem;
        }

        .event-detail-label {
            font-weight: 600;
            min-width: 100px;
            color: var(--Royal-purple);
        }

        .countdown {
            background: linear-gradient(135deg, var(--Light-gray), #f8f9fa);
            padding: 1rem;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(106, 13, 173, 0.1);
        }

        .countdown-timer {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--Royal-purple), var(--Light-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .countdown-timer.ended {
            background: none;
            -webkit-text-fill-color: #777777;
            color: #777777;
        }

        .register-btn {
            display: block;
            width: 100%;
            background: linear-gradient(45deg, var(--Royal-purple), var(--Light-purple));
            color: var(--White);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(106, 13, 173, 0.4);
        }

        .register-btn.ended-btn,
        .register-btn.ended-btn:hover {
            background: #aaaaaa;
            color: #666666;
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
        }

        .registration-section {
            background: linear-gradient(135deg, var(--White), #f8f9fa);
            border-radius: 15px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            margin-top: 2rem;
            border: 2px solid transparent;
            background-clip: padding-box;
            position: relative;
        }

        .registration-section.hidden {
            display: none;
        }

        .progress-container {
            margin: 1.5rem 0 2rem;
            background: var(--Light-gray);
            border-radius: 30px;
            position: relative;
            height: 18px;
            overflow: hidden;
            border: 1px solid rgba(106, 13, 173, 0.25);
        }

        .progress-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--Royal-purple), var(--Light-purple));
            transition: width .4s ease;
        }

        .progress-percent {
            margin-top: .5rem;
            font-size: .85rem;
            font-weight: 600;
            text-align: right;
            color: var(--Royal-purple);
        }

        .wizard-step {
            display: none;
        }

        .wizard-step.active {
            display: block;
        }

        .step-nav {
            display: flex;
            gap: .75rem;
            margin-top: 2rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .step-nav .btn {
            flex: 0 0 auto;
            min-width: 120px;
        }

        .review-message-box {
            background: linear-gradient(135deg, var(--Light-gray), #f8f9fa);
            border: 1px solid rgba(106, 13, 173, 0.15);
            padding: 1rem 1.25rem;
            border-radius: 10px;
            white-space: pre-wrap;
            font-size: .9rem;
            line-height: 1.4;
            max-height: 300px;
            overflow-y: auto;
        }

        .registration-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(45deg, var(--Gold-color), var(--Light-gold));
            border-radius: 15px 15px 0 0;
        }

        .registration-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .registration-header h2 {
            background: linear-gradient(45deg, var(--Royal-purple), var(--Light-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2rem;
        }

        .role-selection {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .role-option {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--Light-gray), #e9ecef);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            border: 2px solid transparent;
        }

        .role-option.active {
            background: linear-gradient(45deg, var(--Royal-purple), var(--Light-purple));
            color: var(--White);
            border-color: var(--Gold-color);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .form-row .form-group {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--Dark-gray);
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--White);
        }

        select[multiple] {
            height: 150px;
        }

        input.error,
        select.error,
        textarea.error {
            border-color: var(--Error-red);
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--Royal-purple);
            box-shadow: 0 0 0 3px rgba(106, 13, 173, 0.1);
        }

        .error-message {
            color: var(--Error-red);
            font-size: 0.85rem;
            margin-top: 0.25rem;
            display: none;
            font-weight: 500;
        }

        .relationship-options {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .relationship-option {
            flex: 1;
            text-align: center;
        }

        .relationship-card {
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--White);
        }

        .relationship-card.selected {
            border-color: var(--Royal-purple);
            background: linear-gradient(135deg, rgba(106, 13, 173, 0.05), rgba(138, 43, 226, 0.05));
        }

        .relationship-card input {
            display: none;
        }

        .camp-selection {
            margin-bottom: 1.5rem;
        }

        .hint-card {
            background: linear-gradient(135deg, var(--Light-gray), #f8f9fa);
            border-left: 4px solid var(--Gold-color);
            padding: 1rem 1.25rem;
            border-radius: 10px;
            margin: 1rem 0 0;
            font-size: .95rem;
        }

        .hint-card h4 {
            margin-bottom: .35rem;
            font-size: 1rem;
            color: var(--Royal-purple);
        }

        .hint-card ul {
            margin-left: 1rem;
            margin-top: .25rem;
        }

        .hint-card li {
            margin: .25rem 0;
        }

        .camp-options {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .camp-option {
            flex: 1;
            min-width: 200px;
        }

        .camp-card {
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--White);
        }

        .camp-card.selected {
            border-color: var(--Royal-purple);
            background: linear-gradient(135deg, rgba(106, 13, 173, 0.05), rgba(138, 43, 226, 0.05));
        }

        .camp-card input {
            display: none;
        }

        .children-section {
            margin-top: 1rem;
            display: none;
        }

        .children-section.active {
            display: block;
        }

        .child-details {
            background: linear-gradient(135deg, var(--Light-gray), #f8f9fa);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 1px solid rgba(106, 13, 173, 0.1);
        }

        .child-input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 0.75rem;
            align-items: center;
        }

        .child-input-group input {
            flex: 1;
        }

        .child-age {
            width: 80px;
        }

        .cost-summary {
            background: linear-gradient(135deg, var(--Light-gray), #f8f9fa);
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(106, 13, 173, 0.1);
        }

        .cost-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .cost-total {
            font-weight: 700;
            font-size: 1.2rem;
            border-top: 2px solid var(--Royal-purple);
            padding-top: 0.5rem;
            margin-top: 0.5rem;
            background: linear-gradient(45deg, var(--Royal-purple), var(--Light-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .deposit-info {
            background: linear-gradient(135deg, var(--Light-gold), #f8f9fa);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            border-left: 4px solid var(--Gold-color);
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            flex-wrap: wrap;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e1e5e9;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-family: inherit;
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--Royal-purple), var(--Light-purple));
            color: var(--White);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(106, 13, 173, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary:disabled:hover {
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--Light-gray), #e9ecef);
            color: var(--Dark-gray);
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #e0e0e0, #dee2e6);
            transform: translateY(-2px);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(45deg, var(--Success-green), #27ae60);
            color: var(--White);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 1000;
        }

        .toast.show {
            display: block;
            animation: fadeIn 0.3s, fadeOut 0.3s 1.7s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;

        .event-filter-count {
            display: inline-flex;

        .event-filter-pill.active .event-filter-count {

        .event-actions-row {

        .cal-btn {

        @media (max-width: 768px) {
            .event-filter-bar {
                justify-content: flex-start;

                padding-bottom: 0.75rem;

            .event-filter-bar::-webkit-scrollbar {
                display: none;
            }

            .event-filter-pill {

                font-size: 0.85rem;
                white-space: nowrap;

            .event-actions-row {
                flex-direction: column;
            }

            .cal-btn {
                width: 100%;
            }

    </style>
</head>

<body class="events-page">
    <div class="top-bar" id="topBar"></div>
    <nav class="navbar" id="navbar"></nav>
    <div class="container events-page-shell">
        <header class="page-header events-page-header">
            <div class="events-page-header-content">
                <h1>Upcoming Events</h1>
                <p>Join us for transformative mentorship experiences, missions, camps, and worship gatherings</p>
            </div>
        </header>

        <!-- Category Filter Pills Bar -->
        <div class="event-filter-container">
            <nav class="event-filter-bar" id="eventFilterBar" aria-label="Event category filters">
                <button class="event-filter-pill active" data-category="all" type="button" onclick="setEventCategory('all')">
                    <i class='bx bx-grid-alt'></i> All Events <span class="event-filter-count" id="count-all">0</span>
                </button>
                <button class="event-filter-pill" data-category="camps" type="button" onclick="setEventCategory('camps')">
                    <i class='bx bx-compass'></i> Mentorship & Camps <span class="event-filter-count" id="count-camps">0</span>
                </button>
                <button class="event-filter-pill" data-category="missions" type="button" onclick="setEventCategory('missions')">
                    <i class='bx bx-globe'></i> High School Missions <span class="event-filter-count" id="count-missions">0</span>
                </button>
                <button class="event-filter-pill" data-category="fellowship" type="button" onclick="setEventCategory('fellowship')">
                    <i class='bx bx-church'></i> Saturday Fellowship <span class="event-filter-count" id="count-fellowship">0</span>
                </button>
                <button class="event-filter-pill" data-category="prayer" type="button" onclick="setEventCategory('prayer')">
                    <i class='bx bx-pray'></i> Prayer & Summits <span class="event-filter-count" id="count-prayer">0</span>
                </button>
            </nav>
        </div>

        <section class="events-grid events-page-grid" id="events">
            <!-- Event cards will be populated by JavaScript -->
        </section>
    </div>

    <div id="eventPopupOverlay" class="event-popup-overlay" aria-hidden="true">
        <div class="event-popup-card" role="dialog" aria-modal="true" aria-label="Upcoming event"></div>
    </div>

    <script src="script.js"></script>
    <script>
        const EVENTS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR58Z6wCKwhZSo9InJmAevsBE_V85ulVc43zmD4qpeqeApt4xROG_GU7KGc11Y7MlDdYLLTQo0CEJvT/pub?gid=0&single=true&output=csv';
        const REGISTRATION_PAGES = {
            branch: 'branch-registration.html',
            camps: 'campsregistration.html'
        };
        const LOCAL_EVENT_IMAGES = {
            branch: 'image/Branch Program 2026.jpg'
        };

        let EVENTS_DATA = [];
        let currentCategory = 'all';
        const eventsGrid = document.getElementById('events');
        const countdownIntervals = {};
        let popupCountdownInterval = null;
        const popupOverlay = document.getElementById('eventPopupOverlay');
        const ENABLE_EVENT_POPUP = false;

        document.addEventListener('DOMContentLoaded', function () {
            sessionStorage.removeItem('popupDismissed');
            showSkeletons();
            fetchEventsData();
        });

        async function fetchEventsData() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);
            try {
                const response = await fetch(EVENTS_CSV_URL, {
                    cache: 'no-store',
                    signal: controller.signal
                });
                if (!response.ok) {
                    throw new Error(`Failed to fetch events: ${response.status}`);
                }
                const csvText = await response.text();
                const rows = parseCsv(csvText);
                if (!rows.length) {
                    throw new Error('Empty CSV response');
                }

                const headers = rows.shift().map(header => header.trim());
                const parsed = rows.map(row => {
                    const item = {};
                    headers.forEach((header, index) => {
                        item[header] = (row[index] || '').trim();
                    });
                    return item;
                });

                EVENTS_DATA = parsed
                    .filter(row => row.isActive === 'TRUE')
                    .map(row => ({
                        id: row.id,
                        title: row.title,
                        subtitle: row.subtitle,
                        startDate: row.startDate,
                        endDate: row.endDate,
                        feePerChild: Number(row.feePerChild) || 0,
                        tag: row.tag,
                        image: row.image,
                        location: row.location,
                        details: row.details,
                        isActive: row.isActive
                    }));

                updateFilterCounts();
                renderEvents();
                if (ENABLE_EVENT_POPUP) {
                    checkAndShowPopup();
                }
            } catch (error) {
                console.error('Error loading events:', error);
                showEventsError();
            } finally {
                clearTimeout(timeoutId);
            }
        }

        function parseCsv(text) {
            const rows = [];
            let row = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];

                if (char === '"') {
                    if (inQuotes && text[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                    continue;
                }

                if (char === ',' && !inQuotes) {
                    row.push(current);
                    current = '';
                    continue;
                }

                if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && text[i + 1] === '\n') {
                        i++;
                    }
                    row.push(current);
                    if (row.length > 1 || row[0] !== '') {
                        rows.push(row);
                    }
                    row = [];
                    current = '';
                    continue;
                }

                current += char;
            }

            if (current.length || row.length) {
                row.push(current);
                rows.push(row);
            }

            return rows;
        }

        function showSkeletons() {
            eventsGrid.classList.add('loading');
            eventsGrid.innerHTML = '';

            const skeletonCard = `
                <div class="event-card skeleton">
                    <div class="event-poster skeleton-block skeleton-shimmer"></div>
                    <div class="event-content">
                        <div class="skeleton-block skeleton-shimmer" style="height:18px; width:70%; margin-bottom:12px;"></div>
                        <div class="skeleton-block skeleton-shimmer" style="height:14px; width:55%; margin-bottom:18px;"></div>
                        <div class="skeleton-block skeleton-shimmer" style="height:12px; width:90%; margin-bottom:10px;"></div>
                        <div class="skeleton-block skeleton-shimmer" style="height:12px; width:80%; margin-bottom:18px;"></div>
                        <div class="skeleton-block skeleton-shimmer" style="height:40px; width:100%; margin-bottom:18px;"></div>
                        <div class="skeleton-block skeleton-shimmer" style="height:42px; width:100%;"></div>
                    </div>
                </div>
            `;

            eventsGrid.innerHTML = skeletonCard + skeletonCard;
        }

        function showEventsError() {
            eventsGrid.classList.remove('loading');
            eventsGrid.innerHTML = `
                <div class="events-message">
                    Unable to load events right now. Please refresh the page or contact us on WhatsApp.
                </div>
            `;
        }

        function showNoEventsMessage() {
            eventsGrid.classList.remove('loading');
            eventsGrid.innerHTML = `
                <div class="events-message">
                    No upcoming events at the moment. Please check back soon.
                </div>
            `;
        }

        function slugify(value) {
            return value
                .toLowerCase()
                .trim()
                .replace(/\s+/g, '-')
                .replace(/[^a-z0-9-]/g, '');
        }

        function getRegistrationUrl(event) {
            const title = (event.title || '').toString().toLowerCase();
            const tag = (event.tag || '').toString().toLowerCase();

            if (title.includes('jewel') || tag.includes('jewel')) {
                return 'https://www.eventsslot.com/jewels-kids-camp-mentorship-proram-0uik';
            }
            if (title.includes('teen') || tag.includes('teen')) {
                return 'https://www.eventsslot.com/teen-life-mentorship-bootcamp-7drw';
            }
            if (title.includes('branch') || tag.includes('branch')) {
                return 'branch-registration.html';
            }
            if (title.includes('camp') || tag.includes('camp')) {
                return 'campsregistration.html';
            }
            return 'campsregistration.html';
        }

        function matchesCategory(event, category) {
            if (category === 'all') return true;
            const text = `${event.tag || ''} ${event.title || ''} ${event.subtitle || ''} ${event.details || ''} ${event.id || ''}`.toLowerCase();
            
            switch (category) {
                case 'missions':
                    return text.includes('mission') || text.includes('outreach') || text.includes('school') || text.includes('evangelism');
                case 'camps':
                    return text.includes('camp') || text.includes('mentorship') || text.includes('branch') || text.includes('teen') || text.includes('jewels');
                case 'fellowship':
                    return text.includes('fellowship') || text.includes('ifc') || text.includes('saturday') || text.includes('worship') || text.includes('service') || text.includes('chapel');
                case 'prayer':
                    return text.includes('prayer') || text.includes('summit') || text.includes('conference') || text.includes('retreat') || text.includes('intercession') || text.includes('fasting');
                default:
                    return text.includes(category.toLowerCase());
            }
        }

        function updateFilterCounts() {
            const categories = ['all', 'missions', 'camps', 'fellowship', 'prayer'];
            categories.forEach(cat => {
                const count = EVENTS_DATA.filter(ev => matchesCategory(ev, cat)).length;
                const countEl = document.getElementById(`count-${cat}`);
                if (countEl) {
                    countEl.textContent = count;
                }
            });
        }

        function setEventCategory(category) {
            currentCategory = category;
            
            const pills = document.querySelectorAll('.event-filter-pill');
            pills.forEach(pill => {
                if (pill.getAttribute('data-category') === category) {
                    pill.classList.add('active');
                } else {
                    pill.classList.remove('active');
                }
            });

            renderEvents();
        }

        function getGoogleCalendarUrl(event) {
            const title = encodeURIComponent(event.title || 'Christhood Ministries Event');
            const subtitle = event.subtitle ? `${event.subtitle}\n\n` : '';
            const details = event.details ? `${event.details}\n\n` : '';
            const desc = encodeURIComponent(`${subtitle}${details}More info: Christhood Ministries`);
            const loc = encodeURIComponent(event.location || 'Nairobi, Kenya');
            
            let datesParam = '';
            try {
                const start = new Date(event.startDate);
                const end = new Date(event.endDate || event.startDate);
                if (!isNaN(start.getTime()) && !isNaN(end.getTime())) {
                    const startIso = start.toISOString().replace(/-|:|\.\d\d\d/g, '');
                    const endIso = end.toISOString().replace(/-|:|\.\d\d\d/g, '');
                    datesParam = `&dates=${startIso}/${endIso}`;
                }
            } catch(e) {}
            
            return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}${datesParam}&details=${desc}&location=${loc}`;
        }

        function renderEvents() {
            eventsGrid.classList.remove('loading');
            eventsGrid.innerHTML = '';
            
            // Clear existing countdown intervals
            Object.keys(countdownIntervals).forEach(id => {
                clearInterval(countdownIntervals[id]);
                delete countdownIntervals[id];
            });

            const filteredEvents = EVENTS_DATA.filter(event => matchesCategory(event, currentCategory));
            eventsGrid.classList.toggle('single', filteredEvents.length === 1);

            if (!filteredEvents.length) {
                if (EVENTS_DATA.length > 0) {
                    eventsGrid.innerHTML = `
                        <div class="events-message" style="grid-column: 1 / -1;">
                            <i class='bx bx-calendar-x' style="font-size: 3rem; display: block; margin-bottom: 0.5rem; color: var(--Gold-color);"></i>
                            <p style="font-size: 1.15rem; font-weight: 600; margin-bottom: 0.5rem;">No upcoming events in this category</p>
                            <p style="opacity: 0.9; margin-bottom: 1.25rem;">Explore our other scheduled ministry events or view all gatherings.</p>
                            <button class="btn btn-primary" onclick="setEventCategory('all')" type="button" style="border-radius: 25px; padding: 10px 26px; border: none; cursor: pointer;">
                                <i class='bx bx-grid-alt'></i> View All Events
                            </button>
                        </div>
                    `;
                } else {
                    showNoEventsMessage();
                }
                return;
            }

            filteredEvents.forEach(event => {
                const card = document.createElement('div');
                const now = new Date();
                const startDate = new Date(event.startDate);
                const endDate = new Date(event.endDate);
                const isEnded = now > endDate;

                card.className = `event-card${isEnded ? ' ended' : ''}`;

                const imageUrl = getEventImageUrl(event);
                const hasImage = Boolean(imageUrl);
                const posterStyle = hasImage
                    ? `style="background-image: url('${imageUrl}');"`
                    : '';
                const posterClass = hasImage ? 'event-poster has-image' : 'event-poster';

                const feeText = Number(event.feePerChild || 0).toLocaleString();
                const locationHtml = event.location
                    ? `
                        <div class="event-detail">
                            <span class="event-detail-label">Location:</span>
                            <span>${event.location}</span>
                        </div>
                    `
                    : '';
                const detailsHtml = event.details
                    ? `
                        <div class="event-detail">
                            <span class="event-detail-label">Details:</span>
                            <span>${event.details}</span>
                        </div>
                    `
                    : '';
                const tagText = isEnded ? 'Ended' : event.tag;
                const countdownText = isEnded ? 'This event has ended' : 'Calculating...';
                const countdownClass = isEnded ? 'countdown-timer ended' : 'countdown-timer';
                const registrationUrl = getRegistrationUrl(event);
                const calUrl = getGoogleCalendarUrl(event);

                let buttonText = 'Register';
                if (now >= startDate && now <= endDate) {
                    buttonText = 'Event Ongoing';
                }

                const buttonHtml = isEnded
                    ? `<button class="register-btn ended-btn" disabled>Event Ended</button>`
                    : `
                        <div class="event-actions-row">
                            <a class="register-btn" href="${registrationUrl}" data-event-id="${event.id}">
                                <i class='bx bx-edit'></i> ${buttonText}
                            </a>
                            <a class="cal-btn" href="${calUrl}" target="_blank" rel="noopener noreferrer" title="Add to Google Calendar">
                                <i class='bx bx-calendar-plus'></i> Add to Calendar
                            </a>
                        </div>
                    `;

                card.innerHTML = `
                    <div class="${posterClass}" ${posterStyle}>
                        <div class="event-tag">${tagText}</div>
                    </div>
                    <div class="event-content">
                        <h3 class="event-title">${event.title}</h3>
                        <p class="event-subtitle">${event.subtitle}</p>
                        <div class="event-details">
                            <div class="event-detail">
                                <span class="event-detail-label">Date:</span>
                                <span>${formatDate(event.startDate)} - ${formatDate(event.endDate)}</span>
                            </div>
                            <div class="event-detail">
                                <span class="event-detail-label">Fee:</span>
                                <span>${feeText} Ksh</span>
                            </div>
                            ${locationHtml}
                            ${detailsHtml}
                        </div>
                        <div class="countdown">
                            <div class="${countdownClass}" id="countdown-${event.id}">${countdownText}</div>
                        </div>
                        ${buttonHtml}
                    </div>
                `;

                eventsGrid.appendChild(card);

                if (!isEnded) {
                    startCountdown(event.id, event.startDate, event.endDate);
                }
            });
        }

        function sanitizeImageUrl(url) {
            const trimmed = url.trim();
            let resolved = trimmed;

            if (trimmed.includes('drive.google.com')) {
                const fileMatch = trimmed.match(/\/file\/d\/([^/]+)/);
                const idMatch = trimmed.match(/[?&]id=([^&]+)/);
                const fileId = fileMatch ? fileMatch[1] : (idMatch ? idMatch[1] : '');
                if (fileId) {
                    resolved = `https://drive.google.com/thumbnail?id=${fileId}&sz=w1200`;
                }
            }

            return resolved.replace(/'/g, '%27').replace(/\"/g, '%22');
        }

        function getEventImageUrl(event) {
            const rawImage = (event.image || '').toString().trim();
            if (rawImage) {
                if (!rawImage.includes('://') && !rawImage.startsWith('/')) {
                    return encodeURI(`image/${rawImage}`);
                }
                return sanitizeImageUrl(rawImage);
            }

            const key = slugify((event.id || '').toString());
            if (key && LOCAL_EVENT_IMAGES[key]) {
                return encodeURI(LOCAL_EVENT_IMAGES[key]);
            }

            const title = (event.title || '').toString().toLowerCase();
            if (title.includes('branch')) {
                return encodeURI(LOCAL_EVENT_IMAGES.branch);
            }

            return '';
        }

        function checkAndShowPopup() {
            if (sessionStorage.getItem('popupDismissed') === 'true') return;

            const now = new Date();
            const windowEnd = new Date(now.getTime() + 14 * 24 * 60 * 60 * 1000);
            const upcoming = EVENTS_DATA
                .filter(event => {
                    const start = new Date(event.startDate);
                    const end = new Date(event.endDate);
                    return start >= now && start <= windowEnd && end > now;
                })
                .sort((a, b) => new Date(a.startDate) - new Date(b.startDate));

            if (!upcoming.length) return;

            const targetEvent = upcoming[0];
            setTimeout(() => {
                if (sessionStorage.getItem('popupDismissed') === 'true') return;
                showEventPopup(targetEvent);
            }, 2000);
        }

        function showEventPopup(event) {
            if (!popupOverlay) return;

            const card = popupOverlay.querySelector('.event-popup-card');
            if (!card) return;

            const imageUrl = getEventImageUrl(event);
            const imageStyle = imageUrl
                ? `style="background-image: url('${imageUrl}');"`
                : '';
            const locationText = event.location ? event.location : 'Kenya';
            const dateText = new Date(event.startDate).toLocaleDateString('en-GB', {
                day: 'numeric',
                month: 'short',
                year: 'numeric'
            });

            card.innerHTML = `
                <button class="event-popup-close" type="button" aria-label="Close">×</button>
                <div class="event-popup-image" ${imageStyle}>
                    <div class="event-tag event-popup-tag">${event.tag}</div>
                </div>
                <div class="event-popup-content">
                    <div class="event-popup-label">Coming Soon</div>
                    <div class="event-popup-title">${event.title}</div>
                    <div class="event-popup-subtitle">${event.subtitle}</div>
                    <div class="event-popup-countdown-label">Event starts in:</div>
                    <div class="event-popup-timer">
                        <div class="event-popup-timer-block">
                            <div class="event-popup-timer-value" data-unit="days">00</div>
                            <div class="event-popup-timer-label">Days</div>
                        </div>
                        <div class="event-popup-timer-block">
                            <div class="event-popup-timer-value" data-unit="hours">00</div>
                            <div class="event-popup-timer-label">Hrs</div>
                        </div>
                        <div class="event-popup-timer-block">
                            <div class="event-popup-timer-value" data-unit="minutes">00</div>
                            <div class="event-popup-timer-label">Min</div>
                        </div>
                        <div class="event-popup-timer-block">
                            <div class="event-popup-timer-value" data-unit="seconds">00</div>
                            <div class="event-popup-timer-label">Sec</div>
                        </div>
                    </div>
                    <div class="event-popup-meta">
                        <div>📅 ${dateText}</div>
                        <div>📍 ${locationText}</div>
                    </div>
                    <button class="event-popup-register" type="button">Register Now →</button>
                    <div class="event-popup-notice">Free to attend • Limited slots available</div>
                </div>
            `;

            popupOverlay.classList.add('show');
            popupOverlay.setAttribute('aria-hidden', 'false');

            const closeBtn = card.querySelector('.event-popup-close');
            const registerBtn = card.querySelector('.event-popup-register');

            if (closeBtn) {
                closeBtn.addEventListener('click', () => closeEventPopup(), { once: true });
            }
            if (registerBtn) {
                registerBtn.addEventListener('click', () => {
                    closeEventPopup();
                    focusRegistration(event);
                }, { once: true });
            }

            startPopupCountdown(event.startDate, card);
        }

        function closeEventPopup() {
            if (!popupOverlay) return;
            sessionStorage.setItem('popupDismissed', 'true');

            const card = popupOverlay.querySelector('.event-popup-card');
            if (card) {
                card.classList.add('closing');
            }

            if (popupCountdownInterval) {
                clearInterval(popupCountdownInterval);
                popupCountdownInterval = null;
            }

            setTimeout(() => {
                popupOverlay.classList.remove('show');
                popupOverlay.setAttribute('aria-hidden', 'true');
                if (card) {
                    card.classList.remove('closing');
                }
            }, 300);
        }

        function startPopupCountdown(startDate, card) {
            if (popupCountdownInterval) {
                clearInterval(popupCountdownInterval);
            }

            const updateCountdown = () => {
                const now = new Date();
                const start = new Date(startDate);
                let diff = start - now;
                if (diff < 0) diff = 0;

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                if (!card) return;
                card.querySelector('[data-unit="days"]').textContent = String(days).padStart(2, '0');
                card.querySelector('[data-unit="hours"]').textContent = String(hours).padStart(2, '0');
                card.querySelector('[data-unit="minutes"]').textContent = String(minutes).padStart(2, '0');
                card.querySelector('[data-unit="seconds"]').textContent = String(seconds).padStart(2, '0');
            };

            updateCountdown();
            popupCountdownInterval = setInterval(updateCountdown, 1000);
        }

        function focusRegistration(event) {
            const registerButton = document.querySelector(`.register-btn[data-event-id="${event.id}"]`);
            const registrationSection = document.getElementById('register');

            if (registrationSection) {
                registrationSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => {
                    if (registerButton) registerButton.click();
                }, 400);
                return;
            }

            if (registerButton) {
                registerButton.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => registerButton.click(), 400);
                return;
            }

            window.location.href = getRegistrationUrl(event);
        }

        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function startCountdown(eventId, startDate, endDate) {
            const element = document.getElementById(`countdown-${eventId}`);
            const update = () => {
                const now = new Date();
                const start = new Date(startDate);
                const end = new Date(endDate);
                let target, label;

                if (now < start) {
                    target = start;
                    label = 'Starts in';
                } else if (now < end) {
                    target = end;
                    label = 'Ends in';
                } else {
                    element.textContent = 'This event has ended';
                    element.classList.add('ended');
                    if (countdownIntervals[eventId]) {
                        clearInterval(countdownIntervals[eventId]);
                    }
                    return;
                }

                const diff = target - now;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                element.textContent = `${label}: ${days}d ${hours}h ${minutes}m ${seconds}s`;
            };

            update();
            countdownIntervals[eventId] = setInterval(update, 1000);
        }
    </script>
</body>
